<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="C·vibe: la plataforma de viajes que conecta tus intereses y vibraciones con experiencias de vida extraordinarias.">
<title>Iniciar sesión · C·vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Manrope:wght@400;500;700&family=DM+Sans:wght@400&family=Geist:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-xcircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 13.2l7.6 4.5M15.8 6.3l-7.6 4.5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.5 7H7z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="8" r="3.5"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7M21 20v-1a4 4 0 0 0-3-3.8"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
<symbol id="i-palm" viewBox="0 0 24 24"><path d="M12 21c0-5 .5-8 3-11"/><path d="M15 10c-1-3-4-4-7-3 2 .2 4 1.2 5 3M15 10c1-3 4-4 7-3-2 .2-4 1.2-5 3M15 10c-3-1-3-5-1-7 .5 2 .8 4.5 1 7M15 10c-4 1-7 4-7 7 2-2 4-3.5 7-7"/></symbol>
</svg>

<main class="login-card">
    <div class="login-top">
        <a href="index.html" class="logo"><span class="logo-square"><svg class="ico"><use href="#i-palm"/></svg></span>C·vibe</a>
        <a href="index.html" class="close-btn" aria-label="Cerrar"><svg class="ico"><use href="#i-xcircle"/></svg></a>
    </div>
    <h1>Inicia Sesión en C·vibe</h1>
    <form action="#" method="post">
        <div class="field">
            <label for="correo">Correo electrónico</label>
            <div class="input-wrap"><svg class="ico"><use href="#i-mail"/></svg><input type="email" id="correo" name="correo" placeholder="tu@email.com" required autocomplete="email"></div>
        </div>
        <div class="field">
            <label for="clave">Contraseña</label>
            <div class="input-wrap"><svg class="ico"><use href="#i-lock"/></svg><input type="password" id="clave" name="clave" placeholder="••••••••" required minlength="6" autocomplete="current-password"><svg class="ico"><use href="#i-eye"/></svg></div>
        </div>
        <button type="submit" class="btn dark">Iniciar Sesión</button>
    </form>
    <p class="login-foot">¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
</main>
</body>
</html>
